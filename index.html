<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f3ee" />
  <title>Wedding Wishing Well</title>

  <style>
    :root {
      --bg: #f7f3ee;
      --card: #fffdf9;
      --text: #2e2a26;
      --muted: #746c64;
      --line: #ddd4ca;
      --button: #2e2a26;
      --button-text: #ffffff;
      --success: #426b4a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.85), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: min(100%, 520px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 44px 30px 34px;
      text-align: center;
      box-shadow: 0 16px 45px rgba(45, 38, 31, 0.08);
    }

    .eyebrow {
      margin: 0 0 10px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 9vw, 52px);
      font-weight: 400;
      line-height: 1.05;
    }

    .divider {
      width: 54px;
      height: 1px;
      margin: 24px auto;
      background: var(--line);
    }

    .message {
      margin: 0 auto 28px;
      max-width: 410px;
      font-size: 17px;
      line-height: 1.65;
      color: var(--muted);
      white-space: pre-line;
    }

    .pay-box {
      padding: 22px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.55);
    }

    .label {
      display: block;
      margin-bottom: 7px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .payid {
      display: block;
      overflow-wrap: anywhere;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 700;
      line-height: 1.25;
    }

    .recipient {
      margin: 12px 0 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
    }

    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      padding: 15px 18px;
      background: var(--button);
      color: var(--button-text);
      font: 700 15px Arial, Helvetica, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover {
      opacity: .92;
    }

    button:active {
      transform: scale(.99);
    }

    .status {
      min-height: 22px;
      margin: 10px 0 0;
      font: 13px Arial, Helvetica, sans-serif;
      color: var(--success);
    }

    .bank-transfer {
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-family: Arial, Helvetica, sans-serif;
    }

    .bank-transfer h2 {
      margin: 0 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      font-weight: 400;
    }

    .bank-details {
      margin: 0;
      display: grid;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .bank-details strong {
      color: var(--text);
      font-weight: 700;
    }

    .note {
      margin: 22px auto 0;
      max-width: 420px;
      font: 13px/1.55 Arial, Helvetica, sans-serif;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 36px 22px 28px;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="coupleNames"></h1>

    <div class="divider"></div>

    <p class="message" id="message"></p>

    <section class="pay-box" aria-label="Payment details">
      <span class="label" id="payIdLabel"></span>
      <span class="payid" id="payId"></span>

      <p class="recipient" id="recipientLine"></p>

      <button id="copyButton" type="button">Copy PayID</button>
      <p class="status" id="copyStatus" aria-live="polite"></p>

      <div class="bank-transfer">
        <h2>Prefer a standard bank transfer?</h2>

        <div class="bank-details">
          <div>BSB: <strong id="bsb"></strong></div>
          <div>Account: <strong id="accountNumber"></strong></div>
          <div>Account name: <strong id="accountName"></strong></div>
        </div>
      </div>
    </section>

    <p class="note" id="note"></p>
  </main>

  <script>
    /*
    ============================================================
      EDIT ONLY THIS SECTION WHEN YOUR DETAILS ARE FINALISED
    ============================================================
    */
    const CONFIG = {
      coupleNames: "Sharlea & Kieren",
      eyebrow: "Wedding Wishing Well",

      message:
        "Your presence at our wedding is more than enough.\n\n" +
        "However, if you would like to contribute towards our future together, " +
        "you can use the PayID below.",

      payId: "kierenandsharlea@gmail.com",
      payIdType: "Email",

      // This should match the name guests will see in their banking app.
      recipientName: "Kieren Quach",

      // Fallback bank transfer details
      bsb: "182-182",
      accountNumber: "013038906",
      accountName: "Kieren The Khang Quach and Sharlea Jade Hoad",

      note:
        "Please check that the recipient name shown in your banking app matches the name above before confirming your payment."
    };
    /*
    ============================================================
      NO NEED TO EDIT BELOW THIS LINE
    ============================================================
    */

    document.title = `${CONFIG.coupleNames} — Wishing Well`;
    document.getElementById("coupleNames").textContent = CONFIG.coupleNames;
    document.getElementById("eyebrow").textContent = CONFIG.eyebrow;
    document.getElementById("message").textContent = CONFIG.message;
    document.getElementById("payId").textContent = CONFIG.payId;
    document.getElementById("payIdLabel").textContent = `PayID — ${CONFIG.payIdType}`;
    document.getElementById("recipientLine").textContent =
      `Recipient name: ${CONFIG.recipientName}`;
    document.getElementById("bsb").textContent = CONFIG.bsb;
    document.getElementById("accountNumber").textContent = CONFIG.accountNumber;
    document.getElementById("accountName").textContent = CONFIG.accountName;
    document.getElementById("note").textContent = CONFIG.note;

    const copyButton = document.getElementById("copyButton");
    const copyStatus = document.getElementById("copyStatus");

    async function copyPayId() {
      copyStatus.textContent = "";

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(CONFIG.payId);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = CONFIG.payId;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();

          const successful = document.execCommand("copy");
          document.body.removeChild(textarea);

          if (!successful) throw new Error("Copy failed");
        }

        copyButton.textContent = "Copied ✓";
        copyStatus.textContent = "PayID copied to your clipboard.";

        setTimeout(() => {
          copyButton.textContent = "Copy PayID";
          copyStatus.textContent = "";
        }, 2500);
      } catch (error) {
        copyStatus.textContent =
          "Couldn't copy automatically. Press and hold the PayID above to copy it.";
      }
    }

    copyButton.addEventListener("click", copyPayId);
  </script>
</body>
</html>
